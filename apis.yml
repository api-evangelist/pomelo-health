name: Pomelo Health
kind: company
description: >-
  Pomelo Health (formerly Chronometriq, founded 2012, headquartered in Montreal
  with offices in Boston and Toronto) is a Canadian patient-engagement software
  company operating within the TELUS Health ecosystem. Its cloud platform helps
  medical clinics reduce no-shows and modernize the front-desk experience with
  online booking/e-booking, automated SMS/voice/email appointment reminders,
  digital intake eForms, telemedicine, secure two-way messaging, patient
  broadcasts, and a patient portal. Pomelo ships as an EMR add-on that syncs
  with TELUS Health EMRs — Accuro, Medesync, and TELUS CHR — rather than as an
  open integration platform. As of this review Pomelo Health publishes NO public
  developer portal, NO documented REST/OpenAPI, and NO public HL7 FHIR
  CapabilityStatement or SMART-on-FHIR surface; third-party connectivity is
  achieved through the underlying EMR partner APIs, so this profile is an honest
  identity stub for a company with a gated, partner-only integration model. Home
  market: Canada.
