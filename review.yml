actions:
  openapiHarvested: false
  fhirCaptured: false
  specsSaved: 0
  reason: >-
    No public developer portal, no documented REST/OpenAPI, and no public FHIR
    CapabilityStatement or SMART-on-FHIR configuration exist for Pomelo Health.
    Nothing could be harvested verbatim without fabrication, so the profile is an
    honest identity stub (built-stub) for a gated, partner-only integration
    model. Home market: Canada.
